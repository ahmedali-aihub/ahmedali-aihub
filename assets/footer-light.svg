<style>
text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;}
.mono{font-family:'SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;}
.num{font-variant-numeric:tabular-nums;}
.sweep{transform:translateX(-408px);animation:sweep 9.0s cubic-bezier(.45,0,.2,1) infinite;}
@keyframes sweep{0%{transform:translateX(-408px) skewX(-18deg);}45%,100%{transform:translateX(1368px) skewX(-18deg);}}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both;}
@keyframes rise{from{opacity:0;transform:translateY(10px);}}
.fade{animation:fade 1s ease both;}
@keyframes fade{from{opacity:0;}}
.live{animation:live 2s ease-in-out infinite;}
@keyframes live{0%,100%{opacity:1;}50%{opacity:.35;}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;}.sweep{display:none;}}
</style>
