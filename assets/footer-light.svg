<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="168" viewBox="0 0 1200 168" role="img" aria-labelledby="t d">
<title id="t">Designed by Ahmed Ali in Hyderabad.</title>
<desc id="d">Profile artwork is hand-built SVG, regenerated by GitHub Actions.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdfdfe"/><stop offset="1" stop-color="#dcdce1"/></linearGradient>
<radialGradient id="glow" cx="0.18" cy="-0.1" r="0.9"><stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
