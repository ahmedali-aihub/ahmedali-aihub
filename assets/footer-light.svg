<linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3a3c"/><stop offset="0.45" stop-color="#1d1d1f"/><stop offset="0.52" stop-color="#6e6e73"/><stop offset="0.64" stop-color="#2c2c2e"/><stop offset="1" stop-color="#48484a"/></linearGradient><linearGradient id="textShine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="240" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.75"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/><animateTransform attributeName="gradientTransform" type="translate" values="80 0;1020 0;1020 0" keyTimes="0;0.45;1" dur="8s" repeatCount="indefinite"/></linearGradient>
