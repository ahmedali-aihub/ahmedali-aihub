.num{font-variant-numeric:tabular-nums;}
.sweep{transform:translateX(-640px);animation:sweep 8s cubic-bezier(.45,0,.2,1) infinite;}
@keyframes sweep{0%{transform:translateX(-640px) skewX(-18deg);}45%,100%{transform:translateX(1600px) skewX(-18deg);}}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both;}
