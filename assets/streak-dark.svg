.mono{font-family:'SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;}
.num{font-variant-numeric:tabular-nums;}
.sweep{transform:translateX(-540px);animation:sweep 9.0s cubic-bezier(.45,0,.2,1) infinite;}
